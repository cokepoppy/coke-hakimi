[platformio]
src_dir = main
boards_dir = boards

[env:hakimi_uac_v3]
platform = espressif32
board = esp32-p4-wlk2802-32mb
framework = espidf
custom_p4_chip_family = v3
board_build.f_cpu = 400000000L
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
upload_speed = 921600
monitor_speed = 115200
extra_scripts =
  scripts/bound_p4_image.py
